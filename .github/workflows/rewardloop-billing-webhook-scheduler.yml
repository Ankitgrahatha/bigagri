name: RewardLoop billing webhook scheduler

on:
  schedule:
    # GitHub Actions supports a five-minute minimum scheduled cadence.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rewardloop-billing-webhook-scheduler
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_PROJECT_REF: guhhuqxrobhuumwrypnc
      PROCESSOR_SECRET: ${{ secrets.RAZORPAY_PROCESSOR_SECRET }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Run bounded webhook processor and alert on unhealthy state
        shell: bash
        run: |
          set -euo pipefail

          alert_title="[RewardLoop Billing Alert] Webhook processor needs attention"
          existing_alert() {
            gh issue list --repo "$GH_REPO" --state open --search '"[RewardLoop Billing Alert]" in:title' --json url --jq '.[0].url // empty'
          }
          create_or_reuse_alert() {
            local reason="$1"
            local existing
            existing="$(existing_alert)"
            if [[ -n "$existing" ]]; then
              echo "::error::Billing alert remains open: $existing"
              return 0
            fi
            gh issue create --repo "$GH_REPO" --title "$alert_title" --body "$reason

          This alert is generated by the scheduled RewardLoop billing monitor. It contains only aggregate health/error metadata; do not add secrets or raw provider payloads."
          }

          if [[ -z "$PROCESSOR_SECRET" ]]; then
            create_or_reuse_alert "The GitHub Actions secret RAZORPAY_PROCESSOR_SECRET is missing. Configure it to match the server-side RAZORPAY_PROCESSOR_SECRET in the approved Supabase project, then close this issue after a successful run."
            echo "::error::Processor secret is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 30 --output "$response_file" --write-out '%{http_code}' \
            --request POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/process-razorpay-webhooks" \
            --header "x-processor-secret: ${PROCESSOR_SECRET}" \
            --header "content-type: application/json" \
            --data '{"limit":25}' || true)"

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            create_or_reuse_alert "The scheduled webhook processor returned HTTP status ${status:-no-response}. Check the deployed function, server-side secret, database connectivity, and sanitized function logs. No request secret or response body was copied into this issue."
            echo "::error::Webhook processor returned a non-success HTTP status."
            exit 1
          fi

          if python3 - "$response_file" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              raise SystemExit("Processor returned a non-JSON response.")
          if data.get("ok") is not True or data.get("health_metrics_available") is not True:
              raise SystemExit("Processor response is missing successful batch status or health metrics.")
          print(json.dumps({
              "ok": data.get("ok"),
              "processed": data.get("processed"),
              "failed": data.get("failed"),
              "exhausted_total": data.get("exhausted_total"),
              "pending_received": data.get("pending_received"),
              "retryable_failed": data.get("retryable_failed"),
              "stale_processing": data.get("stale_processing"),
              "oldest_unprocessed_age_seconds": data.get("oldest_unprocessed_age_seconds"),
          }, sort_keys=True))
          failed = data.get("failed")
          exhausted = data.get("exhausted_total")
          oldest_age = data.get("oldest_unprocessed_age_seconds")
          if not isinstance(failed, int) or not isinstance(exhausted, int) or not isinstance(oldest_age, (int, float)):
              raise SystemExit("Processor health metrics have unexpected types.")
          if failed > 0 or exhausted > 0 or oldest_age > 300:
              with open("/tmp/rewardloop-billing-health-alert.txt", "w", encoding="utf-8") as f:
                  f.write(
                      "Aggregate webhook health crossed an alert threshold.\n\n"
                      f"- failed in this batch: {failed}\n"
                      f"- exhausted events: {exhausted}\n"
                      f"- oldest unprocessed age (seconds): {oldest_age}\n\n"
                      "Inspect the approved operator-only database path and sanitized function logs. "
                      "Do not replay or alter billing state until the cause is understood."
                  )
              raise SystemExit("Aggregate webhook health crossed an alert threshold.")
          PY
          then
            result=0
          else
            result=$?
          fi
          if [[ "$result" -ne 0 ]]; then
            if [[ -f /tmp/rewardloop-billing-health-alert.txt ]]; then
              create_or_reuse_alert "$(cat /tmp/rewardloop-billing-health-alert.txt)"
            else
              create_or_reuse_alert "The processor returned HTTP 2xx but its response was invalid or health telemetry was unavailable. Review sanitized function logs and verify the deployed migration/function versions."
            fi
            exit "$result"
          fi
