name: RewardLoop isolated database regression

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/rewardloop-claim-replay-db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/rewardloop-claim-replay-db.yml"

permissions:
  contents: read

jobs:
  claim-replay:
    name: Isolated PostgreSQL claim replay test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap disposable Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            aud varchar(255),
            role varchar(255),
            email varchar(255),
            encrypted_password varchar(255),
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.jwt() RETURNS jsonb
            LANGUAGE sql STABLE
            AS $$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          SQL

      - name: Load schema-only fixture (no production data)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/rewardloop_schema_snapshot.sql

      - name: Apply actor-scoped claim replay migration to the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021170000_scope_claim_replay_to_actor.sql

      - name: Apply actor-scoped redemption replay migration to the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021182000_scope_redemption_replay_to_actor.sql

      - name: Apply QR-bound claim replay migration to the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021183000_bind_claim_replay_to_qr.sql

      - name: Apply least-privilege grant migration to the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021190000_harden_reward_table_privileges.sql

      - name: Apply append-only ledger trigger to the disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021191000_enforce_points_ledger_append_only.sql

      - name: Apply tenant-scoped public catalog migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021192000_scope_public_catalog_by_tenant.sql

      - name: Run transactional claim replay regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_claim_replay_behavior.test.sql

      - name: Run transactional redemption replay regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_redemption_replay_behavior.test.sql

      - name: Run client-role privilege regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_privilege_hardening.test.sql

      - name: Run public catalog tenant-isolation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_public_catalog_isolation.test.sql

      - name: Seed concurrency-only data in disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_concurrency_fixtures.sql

      - name: Validate concurrency test shell
        run: bash -n supabase/tests/rewardloop_concurrency_smoke.sh

      - name: Run concurrent claim and redemption tests
        run: bash supabase/tests/rewardloop_concurrency_smoke.sh
