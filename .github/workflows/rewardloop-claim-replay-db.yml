name: RewardLoop isolated database regression

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/rewardloop-claim-replay-db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/rewardloop-claim-replay-db.yml"

permissions:
  contents: read

jobs:
  claim-replay:
    name: Isolated PostgreSQL claim replay test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap disposable Supabase-compatible auth roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            aud varchar(255),
            role varchar(255),
            email varchar(255),
            encrypted_password varchar(255),
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.jwt() RETURNS jsonb
            LANGUAGE sql STABLE
            AS $$ SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          SQL

      - name: Validate Supabase project config
        run: |
          python3 - <<'PY'
          import tomllib
          with open("supabase/config.toml", "rb") as f:
              config = tomllib.load(f)
          assert config["project_id"] == "bigagri"
          assert config["db"]["major_version"] == 17
          assert config["db"]["seed"]["enabled"] is True
          assert config["db"]["seed"]["sql_paths"] == ["./seed.sql"]
          print("PASS: Supabase TOML configuration")
          PY

      - name: Apply schema baseline and historical markers in version order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            version="${migration##*/}"
            version="${version%%_*}"
            if [[ "$version" < "20261021170000" ]]; then
              echo "==> baseline/history $migration"
              psql -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done

      - name: Compare clean baseline catalog fingerprints to the captured live schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_live_schema_parity.test.sql

      - name: Apply post-baseline security and feature migrations in version order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            version="${migration##*/}"
            version="${version%%_*}"
            if [[ "$version" > "20261021121229" ]]; then
              echo "==> post-baseline $migration"
              psql -v ON_ERROR_STOP=1 -f "$migration"
            fi
          done

      - name: Verify SaaS billing table and RPC privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saas_billing_privileges.test.sql

      - name: Run SaaS webhook processor behavioral regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saas_webhook_processor_behavior.test.sql

      - name: Run SaaS checkout reservation behavioral regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saas_checkout_behavior.test.sql

      - name: Run SaaS billing portal behavioral regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saas_billing_portal_behavior.test.sql

      - name: Apply local seed data twice to verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Run exact admin dashboard metrics regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_admin_dashboard_metrics.test.sql

      - name: Run atomic campaign budget regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_campaign_budget_behavior.test.sql

      - name: Run audited product creation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_product_creation_behavior.test.sql

      - name: Run audited product lifecycle regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_product_lifecycle_behavior.test.sql

      - name: Run audited product editing regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_product_editing_behavior.test.sql

      - name: Run tenant-scoped fraud case workflow regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_fraud_case_workflow_behavior.test.sql

      - name: Run audited reward catalogue regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_reward_catalogue_behavior.test.sql

      - name: Run tenant invitation lifecycle and authorization regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_tenant_invitation_behavior.test.sql

      - name: Run privileged admin RPC tenant-isolation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_admin_rpc_tenant_isolation.test.sql

      - name: Run transactional claim replay regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_claim_replay_behavior.test.sql

      - name: Run claim replay owner isolation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_claim_replay_owner.test.sql

      - name: Run invalid QR claim rate-limit regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_claim_invalid_rate_limit.test.sql

      - name: Run transactional redemption replay regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_redemption_replay_behavior.test.sql

      - name: Run cancellation/refund/fulfillment accounting regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_redemption_resolution_behavior.test.sql

      - name: Run invalid redemption status regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_redemption_invalid_status.test.sql


      - name: Run client-role privilege regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_privilege_hardening.test.sql

      - name: Run future-object default-privilege regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_default_privileges.test.sql

      - name: Run public catalog tenant-isolation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_public_catalog_isolation.test.sql

      - name: Run partner data RLS isolation regression test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_partner_data_rls_isolation.test.sql

      - name: Seed concurrency-only data in disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rewardloop_concurrency_fixtures.sql

      - name: Validate concurrency test shell
        run: bash -n supabase/tests/rewardloop_concurrency_smoke.sh

      - name: Run concurrent claim and redemption tests
        run: bash supabase/tests/rewardloop_concurrency_smoke.sh
