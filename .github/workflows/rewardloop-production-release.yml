name: RewardLoop controlled production release

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: "Set YES only after reviewing the exact pending migrations and release notes."
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true
      confirm_live_schema_matches_baseline:
        description: "Set YES only after a fresh production schema comparison confirms the checked-in baseline matches the live database."
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true
      confirm_billing_test_secrets_configured:
        description: "Confirm the required Razorpay Edge Function secrets are configured with test-mode credentials only."
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true
      confirm_backup_restore_ready:
        description: "Confirm a current production backup or approved recovery point exists and the restore path/constraints have been reviewed."
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: rewardloop-production-release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirm_production_release == 'YES' && inputs.confirm_billing_test_secrets_configured == 'YES' && inputs.confirm_backup_restore_ready == 'YES' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: guhhuqxrobhuumwrypnc
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      CONFIRM_LIVE_SCHEMA_MATCHES_BASELINE: ${{ inputs.confirm_live_schema_matches_baseline }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Validate credentials and required CI on this exact commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              runs = json.load(response)["workflow_runs"]
          required = {
              "RewardLoop isolated database regression",
              "RewardLoop quality gate",
              "RewardLoop safe smoke tests",
              "RewardLoop legacy route guard",
          }
          passed = {r["name"] for r in runs if r.get("head_sha") == sha and r.get("conclusion") == "success"}
          missing = sorted(required - passed)
          if missing:
              raise SystemExit(f"Refusing production release; required checks have not passed on {sha}: {missing}")
          print(f"PASS: required CI workflows passed on {sha}")

          env_url = f"https://api.github.com/repos/{repo}/environments/production"
          env_req = urllib.request.Request(env_url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(env_req, timeout=20) as response:
              environment = json.load(response)
          protection_rules = environment.get("protection_rules", [])
          if not any(rule.get("type") == "required_reviewers" for rule in protection_rules):
              raise SystemExit("Refusing production release: configure at least one required reviewer on the GitHub 'production' environment.")
          print("PASS: production environment has a required-reviewer protection rule")
          PY

      - name: Verify live leaked-password protection via Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          # The response includes other Auth configuration fields, some of which can
          # contain secrets. Keep it in memory only and print only the required boolean.
          auth_config="$(curl --fail --silent --show-error --max-time 30 \
            --request GET "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json")" || {
              echo "::error::Could not read Supabase Auth configuration. Verify SUPABASE_ACCESS_TOKEN has auth_config_read permission."
              exit 1
            }
          printf '%s' "$auth_config" | python3 -c '
          import json, sys
          try:
              config = json.load(sys.stdin)
          except Exception:
              raise SystemExit("Refusing release: Supabase Auth configuration response was not valid JSON.")
          if config.get("password_hibp_enabled") is not True:
              raise SystemExit("Refusing release: leaked-password protection is disabled or could not be verified.")
          print("PASS: Supabase Auth leaked-password protection is enabled.")
          '
          unset auth_config

      - name: Link the exact production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify required billing secrets exist before any production mutation
        shell: bash
        run: |
          set -euo pipefail
          secrets_output="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
          required=(
            RAZORPAY_WEBHOOK_SECRET
            RAZORPAY_PROCESSOR_SECRET
            RAZORPAY_KEY_ID
            RAZORPAY_KEY_SECRET
            RAZORPAY_MONTHLY_TOTAL_COUNT
            RAZORPAY_YEARLY_TOTAL_COUNT
          )
          missing=()
          for name in "${required[@]}"; do
            if ! grep -Eq "(^|[|[:space:]])${name}([|[:space:]]|$)" <<< "$secrets_output"; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Required billing secrets are missing: %s\\n' "${missing[*]}"
            echo "Refusing release before migration or deployment. Configure test-mode credentials only, then retry."
            exit 1
          fi
          echo "PASS: required billing secret names are configured (values were not printed)."

      - name: Verify live schema fingerprints before migration-history repair
        shell: bash
        run: |
          set -euo pipefail
          # The captured fingerprint describes the pre-baseline state. Later reviewed
          # migrations legitimately change schema/ACLs, so check it only before repair.
          migration_output="$(supabase migration list --linked)"
          printf '%s\n' "$migration_output"
          baseline_state="$(python3 - "$migration_output" <<'PY'
          import re, sys
          baseline = "20261021083000"
          historical = {
            "20261021083115","20261021083135","20261021083153","20261021083301",
            "20261021083322","20261021083507","20261021083518","20261021083620",
            "20261021083632","20261021113806","20261021114631","20261021114919",
            "20261021121229",
          }
          remote = set()
          for line in sys.argv[1].splitlines():
              cells = line.split("|")
              if len(cells) < 2:
                  continue
              match = re.search(r"(?<!\d)(\d{14})(?!\d)", cells[1])
              if match:
                  remote.add(match.group(1))
          if not historical.issubset(remote):
              raise SystemExit("Remote migration history does not match the expected historical baseline.")
          if baseline in remote:
              print("yes")
          elif remote == historical:
              print("no")
          else:
              raise SystemExit("Unexpected remote migration history before baseline repair; refusing production mutation.")
          PY
          )"
          if [[ "$baseline_state" == "yes" ]]; then
            echo "PASS: baseline is already recorded; skip the initial-state fingerprint check."
          else
          python3 - <<'PY' > /tmp/rewardloop-live-schema-query.json
          import json
          from pathlib import Path
          print(json.dumps({"query": Path("supabase/ops/verify_live_schema_baseline.sql").read_text()}))
          PY
          response="$(curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/rewardloop-live-schema-query.json)"
          python3 - "$response" <<'PY'
          import json, sys
          try:
              payload = json.loads(sys.argv[1])
          except Exception:
              raise SystemExit("Live schema parity endpoint returned invalid JSON; refusing production mutation.")
          if isinstance(payload, dict):
              rows = payload.get("result", payload.get("data", payload.get("rows")))
              if rows is None and "baseline_matches" in payload:
                  rows = [payload]
          else:
              rows = payload
          if not isinstance(rows, list) or len(rows) != 1 or rows[0].get("baseline_matches") is not True:
              raise SystemExit("Live schema does not match the captured baseline, or the parity response was unexpected. No migration history or DDL was changed.")
          print("PASS: live schema fingerprints, function security, table ACLs and default ACLs match the captured baseline.")
          PY
          fi

      - name: Reconcile only the verified baseline and validate migration allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          historical = {
            "20261021083115","20261021083135","20261021083153","20261021083301",
            "20261021083322","20261021083507","20261021083518","20261021083620",
            "20261021083632","20261021113806","20261021114631","20261021114919",
            "20261021121229",
          }
          baseline = "20261021083000"
          post = {
            "20261021170000","20261021182000","20261021183000","20261021190000",
            "20261021191000","20261021192000","20261021193000","20261021200000",
            "20261021201000","20261021202000","20261021203000","20261021203100",
            "20261022100000","20261022110000","20261022200000","20261022203000",
            "20261022210000",
            # SaaS billing migrations already present in this repository.
            "20261023100000","20261023110000","20261023120000","20261023130000",
            "20261023140000","20261023150000","20261023160000","20261023170000",
            "20261023180000","20261023190000","20261023200000","20261023210000",
          }
          expected_local = historical | {baseline} | post
          actual_local = {p.name[:14] for p in Path("supabase/migrations").glob("*.sql")}
          if actual_local != expected_local:
              raise SystemExit(f"Local migration allowlist changed. Missing={sorted(expected_local-actual_local)} unexpected={sorted(actual_local-expected_local)}")

          def migration_sets():
              result = subprocess.run(["supabase","migration","list","--linked"],text=True,capture_output=True,check=True)
              print(result.stdout)
              local, remote = set(), set()
              for line in result.stdout.splitlines():
                  cells = line.split("|")
                  if len(cells) < 2:
                      continue
                  left = re.search(r"(?<!\d)(\d{14})(?!\d)", cells[0])
                  right = re.search(r"(?<!\d)(\d{14})(?!\d)", cells[1])
                  if left: local.add(left.group(1))
                  if right: remote.add(right.group(1))
              if local != expected_local:
                  raise SystemExit(f"CLI local migration list differs from allowlist: {sorted(local ^ expected_local)}")
              return local, remote

          local, remote = migration_sets()
          if remote == historical:
              # Never repair migration history from version numbers alone. The baseline
              # DDL is NOT executed on production, but marking it applied is still a
              # production metadata mutation and requires a fresh schema parity review.
              import os
              if os.environ.get("CONFIRM_LIVE_SCHEMA_MATCHES_BASELINE") != "YES":
                  raise SystemExit(
                      "Refusing baseline history repair: select YES only after a fresh, reviewed "
                      "production schema comparison confirms the baseline matches the live schema."
                  )
              subprocess.run(["supabase","migration","repair","--status","applied",baseline,"--linked"],check=True)
              _, remote = migration_sets()
          required_base = historical | {baseline}
          if not required_base.issubset(remote):
              raise SystemExit(f"Remote history is missing expected baseline versions: {sorted(required_base-remote)}")
          if not remote.issubset(local):
              raise SystemExit(f"Remote history contains unknown versions; stop and investigate: {sorted(remote-local)}")
          pending = local - remote
          if pending != post - (remote & post):
              raise SystemExit(f"Unexpected pending migration set: {sorted(pending)}")
          print("Pending, explicitly allowlisted migrations:", *sorted(pending), sep="\n  ")
          PY

      - name: Review pending migration plan (dry run)
        run: supabase db push --linked --dry-run

      - name: Apply reviewed production database migrations
        run: supabase db push --linked

      - name: Verify every repository migration is recorded remotely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          local = {p.name[:14] for p in Path("supabase/migrations").glob("*.sql")}
          result = subprocess.run(["supabase","migration","list","--linked"],text=True,capture_output=True,check=True)
          print(result.stdout)
          remote=set()
          for line in result.stdout.splitlines():
              cells=line.split("|")
              if len(cells)<2: continue
              match=re.search(r"(?<!\d)(\d{14})(?!\d)",cells[1])
              if match: remote.add(match.group(1))
          if remote != local:
              raise SystemExit(f"Migration history mismatch after push. Missing={sorted(local-remote)} unexpected={sorted(remote-local)}")
          print(f"PASS: all {len(local)} local migrations are recorded remotely")
          PY

      - name: Deploy the reviewed RewardLoop and SaaS billing Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function in \
            rewardloop-api \
            rewardloop-admin-settings \
            razorpay-webhook \
            create-razorpay-subscription \
            reconcile-razorpay-subscription \
            saas-checkout-reconciliation \
            saas-billing-portal \
            process-razorpay-webhooks; do
            echo "Deploying reviewed Edge Function: $function"
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Read-only production smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /admin.html /admin-settings.html /admin-billing.html; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://bigagri.vercel.app$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done
          cors_code="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/rewardloop-api" \
            -H 'Origin: https://bigagri.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type')"
          echo "RewardLoop API CORS preflight -> HTTP $cors_code"
          test "$cors_code" = "204"
          auth_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/rewardloop-api" \
            -H 'Content-Type: application/json' --data '{"action":"admin_dashboard"}')"
          echo "Unauthenticated admin API request -> HTTP $auth_code"
          test "$auth_code" = "401" || test "$auth_code" = "403"
          webhook_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/razorpay-webhook" \
            -H 'Content-Type: application/json' --data '{"event":"release_smoke_probe"}')"
          echo "Razorpay webhook invalid-signature guard -> HTTP $webhook_code"
          # A 401 proves the provider callback is deployed and its secret is configured;
          # a 503 means required server-side configuration is missing.
          test "$webhook_code" = "401"
