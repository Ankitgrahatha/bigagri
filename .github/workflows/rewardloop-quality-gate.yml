name: RewardLoop quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "admin.js"
      - "admin-settings.js"
      - "admin-settings.html"
      - "sw.js"
      - "index.html"
      - "admin.html"
      - "admin-settings.html"
      - "admin.css"
      - "styles.css"
      - "manifest.webmanifest"
      - "icon.svg"
      - "vercel.json"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "admin.js"
      - "admin-settings.js"
      - "sw.js"
      - "index.html"
      - "admin.html"
      - "admin-settings.html"
      - "admin.css"
      - "styles.css"
      - "manifest.webmanifest"
      - "icon.svg"
      - "vercel.json"
      - "supabase/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-contract-tests:
    name: Static checks and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check admin-settings.js
          node --check sw.js

      - name: Run RewardLoop contract and replay regression tests
        run: |
          node --test supabase/tests/razorpay_webhook_signature.test.mjs supabase/tests/rewardloop_frontend_asset_smoke.test.mjs supabase/tests/rewardloop_qr_export_recovery.test.mjs supabase/tests/rewardloop_product_creation_contract.test.mjs supabase/tests/rewardloop_product_lifecycle_contract.test.mjs supabase/tests/rewardloop_product_editing_contract.test.mjs supabase/tests/rewardloop_production_release_workflow_contract.test.mjs supabase/tests/rewardloop_client_api_contract.test.mjs supabase/tests/rewardloop_claim_replay_security.test.mjs supabase/tests/rewardloop_claim_rate_limit_ui.test.mjs supabase/tests/rewardloop_claim_replay_resource_security.test.mjs supabase/tests/rewardloop_redemption_replay_security.test.mjs supabase/tests/rewardloop_redemption_resolution_security.test.mjs supabase/tests/rewardloop_redis_rate_limit_contract.test.mjs supabase/tests/rewardloop_admin_settings_security.test.mjs supabase/tests/rewardloop_admin_audit_viewer_security.test.mjs supabase/tests/rewardloop_admin_export_audit_security.test.mjs supabase/tests/rewardloop_auth_recovery_contract.test.mjs supabase/tests/rewardloop_admin_dashboard_metrics.test.mjs supabase/tests/rewardloop_campaign_budget_security.test.mjs supabase/tests/rewardloop_admin_rpc_tenant_isolation_contract.test.mjs supabase/tests/rewardloop_admin_tenant_context_contract.test.mjs supabase/tests/rewardloop_vercel_headers.test.mjs supabase/tests/rewardloop_public_tenant_storefront.test.mjs supabase/tests/rewardloop_claim_replay_owner_security.test.mjs supabase/tests/rewardloop_redemption_replay_owner_security.test.mjs supabase/tests/rewardloop_admin_section_navigation.test.mjs supabase/tests/rewardloop_admin_partner_search.test.mjs

      - name: Validate read-only boundary smoke script
        run: |
          bash -n supabase/tests/rewardloop_cors_smoke_test.sh
          bash supabase/tests/rewardloop_cors_smoke_test.sh

      - name: Ensure production migrations are not silently deployed by CI
        run: |
          test -d supabase/migrations
          echo "Static/contract checks only; isolated PostgreSQL behavior tests run in rewardloop-claim-replay-db.yml. No production database migration is deployed by CI."
