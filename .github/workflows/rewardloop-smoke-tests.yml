name: RewardLoop safe smoke tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "supabase/tests/rewardloop_cors_smoke_test.sh"
      - "supabase/tests/rewardloop_client_api_contract.test.mjs"
      - "supabase/tests/rewardloop_claim_replay_security.test.mjs"
      - "supabase/migrations/**"
      - "supabase/functions/rewardloop-api/**"
      - "app.js"
      - "admin.js"
      - "admin-settings.js"
      - "docs/REPOSITORY_OF_RECORD.md"
      - ".github/workflows/rewardloop-smoke-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/tests/rewardloop_cors_smoke_test.sh"
      - "supabase/tests/rewardloop_client_api_contract.test.mjs"
      - "supabase/tests/rewardloop_claim_replay_security.test.mjs"
      - "supabase/migrations/**"
      - "supabase/functions/rewardloop-api/**"
      - "app.js"
      - "admin.js"
      - "admin-settings.js"
      - "docs/REPOSITORY_OF_RECORD.md"
      - ".github/workflows/rewardloop-smoke-tests.yml"

permissions:
  contents: read

jobs:
  cors-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate smoke-test shell syntax
        run: bash -n supabase/tests/rewardloop_cors_smoke_test.sh
      - name: Check client/API contract
        run: node --test supabase/tests/rewardloop_client_api_contract.test.mjs supabase/tests/rewardloop_claim_replay_security.test.mjs
      - name: Run read-only production boundary checks
        run: bash supabase/tests/rewardloop_cors_smoke_test.sh
