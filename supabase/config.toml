project_id = "bigagri"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

# Razorpay authenticates this endpoint with its HMAC signature over the exact raw
# body. JWT verification is disabled only for this provider callback endpoint.
[functions.razorpay-webhook]
verify_jwt = false

# Internal batch worker uses a dedicated shared secret. Keep it in Supabase secrets
# and the scheduler only; never include it in client code or webhook payloads.
[functions.process-razorpay-webhooks]
verify_jwt = false

# The gateway verifies the bearer JWT; the handler also resolves the user with
# Supabase Auth before performing tenant membership checks. Credentials stay server-side.
[functions.create-razorpay-subscription]
verify_jwt = true

# Read-only checkout reconciliation queue for active tenant super-admins.
[functions.saas-checkout-reconciliation]
verify_jwt = true

# Tenant-scoped read-only plan/subscription view for the billing portal.
[functions.saas-billing-portal]
verify_jwt = true
